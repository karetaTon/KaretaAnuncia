name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar codigo con Gemini y comentar
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { execSync } = require('child_process');

            const baseBranch = context.payload.pull_request.base.ref;
            let diff = '';
            try {
              diff = execSync(`git diff origin/${baseBranch}...HEAD`, { encoding: 'utf-8' });
            } catch (err) {
              console.error('Error obteniendo diff:', err);
              return;
            }

            if (!diff.trim()) {
              console.log('No hay cambios para revisar.');
              return;
            }

            const truncatedDiff = diff.slice(0, 30000);
            const apiKey = process.env.GEMINI_API_KEY;

            if (!apiKey) {
              core.setFailed('Falta el secret GEMINI_API_KEY en la configuracion del repositorio.');
              return;
            }

            const promptText = [
              "Actua como un Senior Software Engineer revisando un Pull Request.",
              "Analiza el siguiente git diff y da una revision breve y clara en Markdown:",
              "- Resumen de los cambios.",
              "- Posibles bugs o mejoras.",
              "",
              "Git Diff:",
              truncatedDiff
            ].join("\n");

            const url = `[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){apiKey}`;

            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });

            const data = await response.json();

            if (!response.ok) {
              console.error('Error de la API de Gemini:', JSON.stringify(data));
              core.setFailed('Error al llamar a la API de Gemini');
              return;
            }

            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No se pudo generar respuesta.';
            const body = `### 🤖 Revisión de Código por Gemini\n\n${aiText}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
